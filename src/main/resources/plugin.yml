name: SHWithdraw
version: '${project.version}'
main: org.Cry_Legende.sHWithdraw.SHWithdraw
api-version: '1.21'
author: Cry_Legende
description: Chèques de SHCoins et bouteilles d'EXP (remplace BeastWithdraw, compatible avec ses objets)
depend: [Vault, NBTAPI]
softdepend: [Essentials, SHLogs]

commands:
  cheque:
    description: Transforme des SHCoins en chèque.
    usage: /cheque <montant|all> [nombre]
  xpbottle:
    description: Met de l'EXP en bouteille.
    usage: /xpbottle <xp|all|<niveaux>l> [nombre]
  shwithdraw:
    description: Administration des chèques et bouteilles d'EXP.
    usage: /shwithdraw <givecashnote|givecashnoteall|givexpbottle|givexpbottleall|info|reload>

permissions:
  shwithdraw.cheque.withdraw:
    description: /cheque
    default: op
  shwithdraw.cheque.withdraw.all:
    description: /cheque all
    default: op
  shwithdraw.cheque.redeem:
    description: Encaisser un chèque
    default: op
  shwithdraw.xpbottle.withdraw:
    description: /xpbottle
    default: op
  shwithdraw.xpbottle.withdraw.all:
    description: /xpbottle all
    default: op
  shwithdraw.xpbottle.redeem:
    description: Boire une bouteille d'EXP
    default: op
  shwithdraw.bypass:
    description: Pas de minimum, de maximum ni de taxe sur /cheque et /xpbottle
    default: op
  shwithdraw.admin:
    description: Toutes les sous-commandes de /shwithdraw et le contournement des limites et taxes
    default: op
    children:
      shwithdraw.admin.givecashnote: true
      shwithdraw.admin.givecashnoteall: true
      shwithdraw.admin.givexpbottle: true
      shwithdraw.admin.givexpbottleall: true
      shwithdraw.admin.info: true
      shwithdraw.admin.reload: true
      shwithdraw.bypass: true
  shwithdraw.admin.givecashnote:
    description: /shwithdraw givecashnote (donner un chèque à un joueur)
    default: op
  shwithdraw.admin.givecashnoteall:
    description: /shwithdraw givecashnoteall (donner un chèque à tous les joueurs en ligne)
    default: op
  shwithdraw.admin.givexpbottle:
    description: /shwithdraw givexpbottle (donner une bouteille d'EXP à un joueur)
    default: op
  shwithdraw.admin.givexpbottleall:
    description: /shwithdraw givexpbottleall (donner une bouteille d'EXP à tous les joueurs en ligne)
    default: op
  shwithdraw.admin.info:
    description: /shwithdraw info (valeur stockée dans le chèque ou la bouteille tenu en main)
    default: op
  shwithdraw.admin.reload:
    description: /shwithdraw reload (recharger config.yml et messages.yml)
    default: op
