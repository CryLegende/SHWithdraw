# SHWithdraw
#
# Transforme des SHCoins en chèques et de l'EXP en bouteilles, encaissables par clic droit.
# Les objets utilisent les clés NBT bCashNote et bWithdrawXp : les chèques et bouteilles déjà en jeu restent encaissables.
# Les messages sont dans messages.yml.
#
# Commandes :
#   /cheque <montant|all> [nombre]            Transforme des SHCoins en chèque.
#   /xpbottle <xp|all|<niveaux>l> [nombre]    Met de l'EXP en bouteille.
#   /shwithdraw <givecashnote|givecashnoteall|givexpbottle|givexpbottleall|reload>
#                                             Donne des chèques ou des bouteilles, recharge la configuration.
#
# Permissions :
#   shwithdraw.cheque.withdraw    Créer un chèque (.all pour /cheque all).
#   shwithdraw.cheque.redeem      Encaisser un chèque.
#   shwithdraw.xpbottle.withdraw  Créer une bouteille d'EXP (.all pour /xpbottle all).
#   shwithdraw.xpbottle.redeem    Utiliser une bouteille d'EXP.
#   shwithdraw.admin              Commandes /shwithdraw, sans limite ni taxe.

# Objet posé au sol si l'inventaire est plein (sinon la création est refusée)
deposer-au-sol: true
# Montants des chèques arrondis à l'entier inférieur
montants-entiers: true
# Interdit chèques et bouteilles dans les crafts (établi, crafter) et les échanges avec les villageois
bloquer-crafts: true
bloquer-villageois: true

cheque:
  materiau: PAPER
  brillant: true
  cle-nbt: bCashNote
  nom-joueur: '&b&lCheque &7(Clic droit)'
  lore-joueur:
    - '&fChèque de banque encaissable'
    - ''
    - '&bMontant: &7%amount% SHCoins'
    - '&bFait par: &7%player%'
  nom-serveur: '&b&lCheque &7(Clic droit)'
  lore-serveur:
    - '&fChèque de banque encaissable'
    - ''
    - '&bMontant: &7%amount% SHCoins'
  min: 100
  max: 1000000
  max-par-commande: 64
  # Pourcentage retiré de la valeur du chèque
  taxe: 5
  format: '###,##0.00'
  son-creation: item.book.page_turn
  son-encaissement: entity.experience_orb.pickup

bouteille:
  materiau: EXPERIENCE_BOTTLE
  brillant: true
  cle-nbt: bWithdrawXp
  nom-joueur: '&a&lExperience &7(Clic droit)'
  lore-joueur:
    - '&fExperience condensée en bouteille'
    - ''
    - '&aValeur: &7%amount% EXP'
    - '&aEnchanteur: &7%player%'
  nom-serveur: '&a&lExperience &7(Clic droit)'
  lore-serveur:
    - '&fExperience condensée en bouteille'
    - ''
    - '&aValeur: &7%amount% EXP'
  min: 25
  max: 30970
  max-par-commande: 64
  taxe: 1
  format: '###,##0'
  # true : l'EXP est ajoutée directement au clic droit ; false : la bouteille est lancée
  ramassage-auto: true
  son-creation: item.bottle.fill
  son-encaissement: entity.experience_orb.pickup

# Lignes écrites dans SHLogs (plugins/SHLogs/SHWithdraw/).
# fichier : nom du fichier de log. Les autres clés sont les lignes écrites.
logs:
  cheque:
    fichier: "cheques"
    # Création par un joueur. Variables : %player%, %count%, %amount% (valeur d'un chèque, taxe déduite), %total% (SHCoins retirés), %tax%.
    creation: "%player% -> crée %count% x chèque de %amount% SHCoins (%total% SHCoins retirés, taxe %tax% SHCoins)"
    # Encaissement. Variables : %player%, %amount%.
    encaissement: "%player% -> encaisse un chèque de %amount% SHCoins"
    # Chèque donné avec /shwithdraw. Variables : %sender%, %player%, %count%, %amount%.
    don: "%sender% -> donne %count% x chèque de %amount% SHCoins à %player%"
  bouteille:
    fichier: "bouteilles-exp"
    # Création par un joueur. Variables : %player%, %count%, %amount% (EXP d'une bouteille, taxe déduite), %total% (EXP retirés), %tax%.
    creation: "%player% -> crée %count% x bouteille d'EXP de %amount% EXP (%total% EXP retirés, taxe %tax% EXP)"
    # Utilisation. Variables : %player%, %amount%.
    encaissement: "%player% -> utilise une bouteille d'EXP de %amount% EXP"
    # Bouteille donnée avec /shwithdraw. Variables : %sender%, %player%, %count%, %amount%.
    don: "%sender% -> donne %count% x bouteille d'EXP de %amount% EXP à %player%"
